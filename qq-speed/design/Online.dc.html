<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Online Room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Chakra+Petch:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080F}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #07080F; color: #F4F1E8; font-family: 'Chakra Petch', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -20%; right: -20%; top: 64%; bottom: -10%; transform: perspective(420px) rotateX(62deg); transform-origin: top center; background-image: linear-gradient(rgba(54,226,255,0.22) 1px, transparent 1px), linear-gradient(90deg, rgba(54,226,255,0.22) 1px, transparent 1px); background-size: 64px 64px"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 40px 64px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
      <div style="display: flex; align-items: center; gap: 20px">
        <button aria-label="Leave room" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.14); background: rgba(13,15,26,0.85); color: #F4F1E8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <div>
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #36E2FF">PRIVATE ROOM</div>
          <div style="font-family: 'Bungee', sans-serif; font-size: 56px; line-height: 1; letter-spacing: 8px; color: #36E2FF; text-shadow: 0 0 30px rgba(54,226,255,0.45)">KX4P9</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; height: 40px; border-radius: 20px; background: rgba(124,255,158,0.12); color: #7CFF9E; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7CFF9E"></span>38 ms</span>
        <button style="height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.14); background: rgba(13,15,26,0.85); color: #F4F1E8; font-size: 14px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>COPY INVITE</button>
        <button style="height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.14); background: rgba(13,15,26,0.85); color: #F4F1E8; font-size: 14px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v13M7 8l5-5 5 5"></path></svg>SHARE</button>
      </div>
    </header>

    <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; min-height: 0">
      <section aria-label="Racers" style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 20px; background: rgba(13,15,26,0.9); border: 1px solid rgba(255,255,255,0.12)">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #A3A6BF; margin-bottom: 4px"><span>RACERS</span><span>4 / 6</span></div>
        <sc-for list="{{players}}" as="p" hint-placeholder-count="6">
          <div style="{{p.style}}">
            <span style="width: 14px; height: 14px; border-radius: 7px; border: 2px solid #F4F1E8; background: {{p.color}}; flex: none"></span>
            <div style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 16px">{{p.name}}</b><span style="font-size: 13px; color: #A3A6BF">{{p.car}}</span></div>
            <span style="{{p.tagStyle}}">{{p.tag}}</span>
          </div>
        </sc-for>
      </section>

      <section aria-label="Room settings" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 20px; background: rgba(13,15,26,0.9); border: 1px solid rgba(255,255,255,0.12)">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #A3A6BF"><span>TRACK</span><span style="letter-spacing: 0; font-weight: 600">You are the host</span></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{tracks}}" as="t" hint-placeholder-count="7">
            <button style="{{t.style}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.tint}}"></span>{{t.name}}</button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #A3A6BF">MODE</span>
            <div style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.05)"><button style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: #36E2FF; color: #07080F; font-weight: 700">Speed</button><button style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: #C9CBDB; font-weight: 700">Item</button></div></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #A3A6BF">LAPS</span>
            <div style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.05)"><button style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: #C9CBDB; font-weight: 700">1</button><button style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: #36E2FF; color: #07080F; font-weight: 700">2</button><button style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: #C9CBDB; font-weight: 700">3</button><button style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: #C9CBDB; font-weight: 700">5</button></div></div>
        </div>
        <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.04)">
          <svg viewBox="0 0 520 170" width="140" height="46" aria-hidden="true"><path d="M40 120 C40 100 60 92 96 88 L170 60 C210 44 300 42 350 58 L420 84 C462 90 486 100 488 122 L484 132 L40 132 Z" fill="#FF3B3B"></path><circle cx="130" cy="132" r="26" fill="#07080F" stroke="#3A3D52" stroke-width="6"></circle><circle cx="400" cy="132" r="26" fill="#07080F" stroke="#3A3D52" stroke-width="6"></circle></svg>
          <div style="flex: 1"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #A3A6BF">YOUR CAR</div><b style="font-size: 18px">Ferrari</b></div>
          <button style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #F4F1E8; font-weight: 700">Change</button>
        </div>
      </section>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px">
      <span style="font-size: 15px; color: #C9CBDB">Waiting for <b style="color: #F4F1E8">HanaRS</b> to get ready…</span>
      <div style="display: flex; gap: 14px">
        <button style="height: 64px; padding: 0 28px; border-radius: 16px; border: 2px solid #36E2FF; background: rgba(13,15,26,0.85); color: #F4F1E8; font-size: 16px; font-weight: 700; letter-spacing: 2px; box-shadow: 0 5px 0 #0B6A80">ADD AI RIVALS</button>
        <button style="height: 64px; padding: 0 44px; border: 0; border-radius: 16px; background: #36E2FF; color: #07080F; font-family: 'Bungee', sans-serif; font-size: 22px; letter-spacing: 2px; box-shadow: 0 6px 0 #0B6A80">START RACE</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [['NightRunner (you)', 'Ferrari', '#FF3B3B', 'HOST', '#FFD23A'], ['SilentKoi', 'Koenigsegg', '#3A6BFF', 'READY', '#7CFF9E'], ['Mira_Falcon', 'Porsche', '#B6FF3B', 'READY', '#7CFF9E'], ['HanaRS', 'McLaren', '#FF8A00', 'NOT READY', '#FFC24A']];
    const players = P.map(([name, car, color, tag, tc], i) => ({
      name, car, color, tag,
      tagStyle: 'padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1px; background: ' + tc + '; color: #07080F',
      style: 'display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 14px; border-radius: 12px; ' + (i === 0 ? 'background: rgba(255,210,58,0.12)' : 'background: rgba(255,255,255,0.04)')
    }));
    for (let i = P.length; i < 6; i++) players.push({ name: 'Open slot', car: 'Invite a friend with the code', color: 'transparent', tag: '', tagStyle: 'display: none', style: 'display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 14px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2); color: #7C7F99' });
    const T = [['City 11', '#4A8CFF'], ['Aegean', '#2EC4B6'], ['Pyramid', '#E0A84A'], ['Snow', '#CFE6FF'], ['Neon Tokyo', '#FF3DA6'], ['Harbor Bay', '#E0574A'], ['Dune', '#E0884A']];
    return {
      players,
      tracks: T.map(([name, tint], i) => ({
        name, tint,
        style: 'display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; ' + (i === 4 ? 'background: rgba(54,226,255,0.16); border: 1px solid #36E2FF; color: #F4F1E8' : 'background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #F4F1E8')
      }))
    };
  }
}
</script>
</body>
</html>
