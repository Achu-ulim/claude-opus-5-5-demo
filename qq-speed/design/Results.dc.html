<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race Results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Chakra+Petch:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080F}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #07080F; color: #F4F1E8; font-family: 'Chakra Petch', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -20%; right: -20%; top: 56%; bottom: -10%; transform: perspective(420px) rotateX(62deg); transform-origin: top center; background-image: linear-gradient(rgba(54,226,255,0.22) 1px, transparent 1px), linear-gradient(90deg, rgba(54,226,255,0.22) 1px, transparent 1px); background-size: 64px 64px"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 56%; height: 1px; background: #FFD23A; opacity: 0.5; box-shadow: 0 0 24px 4px #FFD23A"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 40px 64px; display: grid; grid-template-columns: 1fr 520px; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #A3A6BF">NEON TOKYO · SPEED RACE · 2 LAPS</div>
        <div style="display: flex; align-items: baseline; gap: 18px">
          <div style="font-family: 'Bungee', sans-serif; font-size: 160px; line-height: 0.9; color: #FFD23A; text-shadow: 0 0 40px rgba(255,210,58,0.4)">1ST</div>
          <div style="font-family: 'Bungee', sans-serif; font-size: 40px; line-height: 1">/ 6</div>
        </div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 34px">YOU WON!</div>
      </div>

      <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; background: rgba(54,226,255,0.12); border: 1px solid rgba(54,226,255,0.5); color: #36E2FF; font-weight: 700; letter-spacing: 1px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16.5 5.5 21l2-7.5L2 9h7z"></path></svg>
        NEW TRACK RECORD · BEST LAP 0:41.27
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 700px">
        <div style="padding: 14px 16px; border-radius: 14px; background: rgba(13,15,26,0.84); border: 1px solid rgba(255,255,255,0.12)"><div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A3A6BF">TOTAL</div><div style="font-family: 'Bungee', sans-serif; font-size: 24px; margin-top: 4px">1:24.06</div></div>
        <div style="padding: 14px 16px; border-radius: 14px; background: rgba(13,15,26,0.84); border: 1px solid rgba(255,255,255,0.12)"><div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A3A6BF">TOP SPEED</div><div style="font-family: 'Bungee', sans-serif; font-size: 24px; margin-top: 4px">231 <span style="font-size: 14px">KM/H</span></div></div>
        <div style="padding: 14px 16px; border-radius: 14px; background: rgba(13,15,26,0.84); border: 1px solid rgba(255,255,255,0.12)"><div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A3A6BF">PERFECT BOOSTS</div><div style="font-family: 'Bungee', sans-serif; font-size: 24px; margin-top: 4px">7</div></div>
        <div style="padding: 14px 16px; border-radius: 14px; background: rgba(13,15,26,0.84); border: 1px solid rgba(255,255,255,0.12)"><div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A3A6BF">DRIFT</div><div style="font-family: 'Bungee', sans-serif; font-size: 24px; margin-top: 4px">1,840 M</div></div>
      </div>

      <div style="max-width: 700px; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 14px; background: rgba(13,15,26,0.84); border: 1px solid rgba(255,255,255,0.12)">
        <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Driver level <b style="color: #FFD23A">12</b></span><span style="color: #36E2FF">+240 XP</span></div>
        <div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,0.1); overflow: hidden; display: flex"><div style="width: 58%; background: #FFD23A"></div><div style="width: 18%; background: #36E2FF"></div></div>
        <div style="font-size: 13px; color: #A3A6BF">760 XP to level 13 · unlocks the Chrome paint</div>
      </div>

      <div style="margin-top: auto; display: flex; gap: 14px">
        <button style="height: 64px; padding: 0 40px; border: 0; border-radius: 16px; background: #FFD23A; color: #07080F; font-family: 'Bungee', sans-serif; font-size: 22px; letter-spacing: 2px; box-shadow: 0 6px 0 #A67C00">RACE AGAIN</button>
        <button style="height: 64px; padding: 0 24px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.3); background: rgba(13,15,26,0.85); color: #F4F1E8; font-size: 16px; font-weight: 700; letter-spacing: 2px; box-shadow: 0 5px 0 #2A2C3C">WATCH REPLAY</button>
        <button style="height: 64px; padding: 0 24px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.3); background: rgba(13,15,26,0.85); color: #F4F1E8; font-size: 16px; font-weight: 700; letter-spacing: 2px; box-shadow: 0 5px 0 #2A2C3C">LOBBY</button>
      </div>
    </div>

    <section aria-label="Standings" style="align-self: start; display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 20px; background: rgba(13,15,26,0.9); border: 1px solid rgba(255,255,255,0.12)">
      <div style="display: grid; grid-template-columns: 48px 1fr 96px 84px 44px; gap: 8px; padding: 0 12px 8px; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A3A6BF"><span>POS</span><span>RACER</span><span>TIME</span><span>BEST</span><span>PTS</span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="{{r.style}}">
          <span style="font-family: 'Bungee', sans-serif; font-size: 20px; color: {{r.posColor}}">{{r.pos}}</span>
          <span style="display: flex; align-items: center; gap: 10px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{r.dot}}"></span>{{r.name}}</span>
          <span>{{r.time}}</span>
          <span style="color: #C9CBDB">{{r.best}}</span>
          <span style="color: #7CFF9E; font-weight: 700">{{r.pts}}</span>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['1', 'You · NightRunner', '#FF3B3B', '1:24.06', '0:41.27', '+10', true],
      ['2', 'SilentKoi', '#3A6BFF', '1:24.91', '0:41.80', '+7'],
      ['3', 'Mira_Falcon', '#B6FF3B', '1:26.33', '0:42.55', '+5'],
      ['4', 'TurboLeo', '#FF8A00', '1:27.02', '0:42.96', '+3'],
      ['5', 'HanaRS', '#B48CFF', '1:29.40', '0:43.81', '+2'],
      ['6', 'Comet42', '#D7DAE5', '1:31.18', '0:44.70', '+1']
    ];
    return {
      rows: R.map(([pos, name, dot, time, best, pts, me]) => ({
        pos, name, dot, time, best, pts,
        posColor: pos === '1' ? '#FFD23A' : '#F4F1E8',
        style: 'display: grid; grid-template-columns: 48px 1fr 96px 84px 44px; gap: 8px; align-items: center; min-height: 52px; padding: 0 12px; border-radius: 12px; font-size: 15px; ' +
          (me ? 'background: rgba(255,210,58,0.14); border: 1px solid rgba(255,210,58,0.5)' : 'border: 1px solid transparent')
      }))
    };
  }
}
</script>
</body>
</html>
