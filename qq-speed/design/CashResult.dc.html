<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cash Race Result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Chakra+Petch:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080F}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #07080F; color: #F4F1E8; font-family: 'Chakra Petch', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -20%; right: -20%; top: 60%; bottom: -10%; transform: perspective(420px) rotateX(62deg); transform-origin: top center; background-image: linear-gradient(rgba(124,255,158,0.18) 1px, transparent 1px), linear-gradient(90deg, rgba(124,255,158,0.18) 1px, transparent 1px); background-size: 64px 64px"></div>
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 40px 64px; display: grid; grid-template-columns: 1fr 480px; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 22px">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #A3A6BF">CASH RACE C-4M9X · NEON TOKYO · 6 RACERS</div>
      <div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 34px">YOU WON</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 128px; line-height: 0.95; color: #7CFF9E; text-shadow: 0 0 40px rgba(124,255,158,0.35)">₦540</div>
        <div style="font-size: 15px; color: #A3A6BF">Pool ₦600 · platform fee ₦60 (10%)</div>
      </div>

      <section aria-label="Payout progress" style="display: flex; flex-direction: column; gap: 10px; max-width: 640px; padding: 18px 20px; border-radius: 16px; background: rgba(13,15,26,0.92); border: 1px solid rgba(255,255,255,0.12)">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 14px">
            <span style="{{s.dot}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
            <div style="display: flex; flex-direction: column"><b style="font-size: 15px">{{s.name}}</b><span style="font-size: 13px; color: #8A8DA6">{{s.note}}</span></div>
          </div>
        </sc-for>
      </section>

      <div style="margin-top: auto; display: flex; gap: 12px">
        <button style="height: 62px; padding: 0 30px; border: 0; border-radius: 16px; background: #7CFF9E; color: #07080F; font-family: 'Bungee', sans-serif; font-size: 18px; letter-spacing: 1px; box-shadow: 0 6px 0 #2F8A4E">WITHDRAW</button>
        <button style="height: 62px; padding: 0 24px; border-radius: 16px; border: 2px solid #FFD23A; background: transparent; color: #FFD23A; font-size: 16px; font-weight: 700; letter-spacing: 1px">CONVERT TO TOKENS</button>
        <button style="height: 62px; padding: 0 24px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.25); background: transparent; color: #F4F1E8; font-size: 16px; font-weight: 700; letter-spacing: 1px">RACE AGAIN</button>
      </div>
    </div>

    <section aria-label="Standings" style="align-self: start; display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 20px; background: rgba(13,15,26,0.92); border: 1px solid rgba(255,255,255,0.12)">
      <div style="display: grid; grid-template-columns: 48px 1fr 100px 90px; padding: 0 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A3A6BF"><span>POS</span><span>RACER</span><span>TIME</span><span style="text-align: right">PAYOUT</span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="{{r.style}}"><span style="font-family: 'Bungee', sans-serif; font-size: 18px">{{r.pos}}</span><span style="font-weight: 600">{{r.name}}</span><span style="color: #C9CBDB">{{r.time}}</span><span style="{{r.payStyle}}">{{r.pay}}</span></div>
      </sc-for>
      <div style="margin-top: 8px; font-size: 13px; color: #8A8DA6; line-height: 1.5">Think something's wrong? <b style="color: #C9CBDB">Report this race</b> within 10 minutes and the payout is held while we review the replay.</div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = 'M5 12l5 5L20 7', clock = 'M12 7v5l3 2';
    const dot = (c, fill) => 'width: 28px; height: 28px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; ' + (fill ? 'background: ' + c + '; color: #07080F' : 'border: 2px solid ' + c + '; color: ' + c);
    const R = [['1', 'You · NightRunner', '1:24.06', '₦540', 1], ['2', 'SilentKoi', '1:24.91', '—'], ['3', 'Mira_Falcon', '1:26.33', '—'], ['4', 'TurboLeo', '1:27.02', '—'], ['5', 'HanaRS', '1:29.40', '—'], ['DNF', 'Comet42', 'Disconnected', '—']];
    return {
      steps: [
        { name: 'Race finished', note: 'You crossed the line first', icon: ok, dot: dot('#7CFF9E', true) },
        { name: 'Result checked by the server', note: 'Lap times, speeds and positions verified', icon: ok, dot: dot('#7CFF9E', true) },
        { name: 'Paid to your cash balance', note: 'Available in 9:12 after the report window closes', icon: clock, dot: dot('#FFD23A', false) }
      ],
      rows: R.map(([pos, name, time, pay, me]) => ({
        pos, name, time, pay,
        payStyle: 'text-align: right; font-weight: 700; color: ' + (me ? '#7CFF9E' : '#7C7F99'),
        style: 'display: grid; grid-template-columns: 48px 1fr 100px 90px; align-items: center; min-height: 50px; padding: 0 12px; border-radius: 12px; font-size: 15px; ' + (me ? 'background: rgba(124,255,158,0.12); border: 1px solid rgba(124,255,158,0.5)' : 'border: 1px solid transparent')
      }))
    };
  }
}
</script>
</body>
</html>
