<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm New Device</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Chakra+Petch:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080F}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#FFD23A}a:hover{color:#FFE680}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #07080F; color: #F4F1E8; font-family: 'Chakra Petch', sans-serif; display: flex; align-items: center; justify-content: center">
  <div aria-hidden="true" style="position: absolute; left: -20%; right: -20%; top: 62%; bottom: -10%; transform: perspective(420px) rotateX(62deg); transform-origin: top center; background-image: linear-gradient(rgba(54,226,255,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(54,226,255,0.2) 1px, transparent 1px); background-size: 64px 64px"></div>

  <form style="position: relative; width: 520px; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 40px; border-radius: 24px; background: rgba(13,15,26,0.95); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 80px rgba(0,0,0,0.5); box-sizing: border-box; text-align: center">
    <div style="width: 72px; height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: center; background: rgba(54,226,255,0.14); color: #36E2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 30px">NEW DEVICE</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #C9CBDB">Hi <b style="color: #F4F1E8">NightRunner</b>. We sent a 6-digit code to<br><b style="color: #F4F1E8">ni•••••@gmail.com</b></p>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; gap: 10px">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">Six-digit code</legend>
      <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
        <input aria-label="{{d.label}}" value="{{d.v}}" maxlength="1" inputmode="numeric" style="{{d.style}}">
      </sc-for>
    </fieldset>

    <label style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #C9CBDB; cursor: pointer"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #FFD23A">Remember this device</label>

    <button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 16px; background: #FFD23A; color: #07080F; font-family: 'Bungee', sans-serif; font-size: 20px; letter-spacing: 2px; box-shadow: 0 5px 0 #A67C00">CONFIRM</button>

    <div style="display: flex; justify-content: space-between; width: 100%; font-size: 14px; color: #A3A6BF">
      <span>No email? <b style="color: #F4F1E8">Resend in 0:42</b></span>
      <a href="LogIn.dc.html" style="color: #A3A6BF">Not you?</a>
    </div>
    <div style="font-size: 12px; color: #6E7190">The code works for 10 minutes. Check your spam folder if it doesn't arrive.</div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = ['4', '8', '1', '', '', ''];
    return {
      digits: v.map((d, i) => ({
        v: d, label: 'Digit ' + (i + 1),
        style: 'width: 60px; height: 72px; border-radius: 14px; text-align: center; font-family: Bungee, sans-serif; font-size: 30px; color: #F4F1E8; background: rgba(255,255,255,0.05); border: 2px solid ' + (i === 3 ? '#FFD23A' : d ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.12)') + (i === 3 ? '; box-shadow: 0 0 0 4px rgba(255,210,58,0.2)' : '')
      }))
    };
  }
}
</script>
</body>
</html>
