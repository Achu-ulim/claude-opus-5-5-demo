# Netlify deploy config. For a Git-connected site, set the base directory to qq-speed in the Netlify UI.
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Online play server, printed by `npm run mp:deploy`. Without it the Online screen says online play isn't set up.
  # MP_URL = "wss://driftbolt-mp.<your-subdomain>.workers.dev"

# The service worker must always be revalidated, or players stay pinned to an old build
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
